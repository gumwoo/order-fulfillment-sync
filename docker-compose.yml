# 로컬 개발용 인프라: MySQL 8, Redis, LocalStack(SQS)
# 계정 정보는 로컬 전용 값이다. 운영 값은 넣지 않는다.
name: order-fulfillment-sync

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: fulfillment
      MYSQL_USER: fulfillment
      MYSQL_PASSWORD: fulfillment
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.12-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  localstack:
    # 2026.x(캘린더 버전) 이전 마지막 4.x 태그로 고정
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-northeast-2
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
